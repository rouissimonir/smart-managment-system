services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smartmgmt-db
    environment:
      POSTGRES_DB: smartmgmt
      POSTGRES_USER: smartmgmt
      POSTGRES_PASSWORD: smartmgmt
    ports:
      # Host 5432 is often taken by a native Postgres install; use 5433 outside.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmgmt -d smartmgmt"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["demo"]
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/smartmgmt
      DB_USERNAME: smartmgmt
      DB_PASSWORD: smartmgmt
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to 32+ bytes}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEMO_SEED: ${DEMO_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    profiles: ["demo"]
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  db-data:
