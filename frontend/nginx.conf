server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
